<div class="flex flex-col gap-5">
  <div *ngIf="isLoading()" class="space-y-4 animate-pulse">
    <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
      <div
        *ngFor="let _ of skeletonItems"
        class="h-20 rounded-2xl bg-[#F3EDF7]"
      ></div>
    </div>
    <div
      *ngFor="let _ of skeletonItems"
      class="h-28 rounded-2xl bg-[#F3EDF7]"
    ></div>
  </div>

  <ng-container *ngIf="!isLoading()">
    <div
      *ngIf="loadError()"
      class="flex flex-col items-center gap-3 rounded-2xl border border-[#F5D0D0] bg-[#FDF4F4] px-6 py-10 text-center"
    >
      <div
        class="flex h-14 w-14 items-center justify-center rounded-full bg-white text-[#D04E4E]"
      >
        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
      </div>
      <h4 class="text-base font-bold text-[#2D2340]">Unable to load orders</h4>
      <p class="max-w-md text-sm text-[#7E7391]">{{ loadError() }}</p>
      <button
        type="button"
        (click)="retryLoad()"
        class="mt-2 rounded-xl bg-[#4F266E] px-6 py-2.5 text-xs font-bold text-white transition hover:bg-[#5C2D82]"
      >
        Try Again
      </button>
    </div>

    <ng-container *ngIf="!loadError()">
      <app-order-profile-stats
        *ngIf="orders().length > 0"
        [stats]="profileStats()"
      ></app-order-profile-stats>

      <div
        *ngIf="orders().length === 0"
        class="flex flex-col items-center gap-3 rounded-2xl border border-[#ECE8F3] bg-white py-12 text-center shadow-sm"
      >
        <div
          class="flex h-16 w-16 items-center justify-center rounded-full bg-[#F3EDF7] text-[#4B1D5A]"
        >
          <i class="fa-solid fa-box-open text-2xl"></i>
        </div>
        <h4 class="text-base font-bold text-[#2D2340]">No orders yet</h4>
        <p class="max-w-sm text-xs text-[#9D93AF]">
          Your order history will appear here after you complete checkout.
        </p>
        <a
          routerLink="/products"
          class="mt-3 rounded-xl bg-[#4B1D5A] px-6 py-2.5 text-xs font-bold text-white transition hover:bg-[#3C1748]"
        >
          Start Shopping
        </a>
      </div>

      <div *ngIf="orders().length > 0" class="flex flex-col gap-4">
        <app-order-preview-card
          *ngFor="let order of orders()"
          [order]="order"
          [enableCancel]="true"
          [cancellingOrderId]="cancellingOrderId()"
          (viewDetails)="openDetails($event)"
          (trackOrder)="trackOrder($event)"
          (cancelOrder)="openCancelConfirm($event)"
        ></app-order-preview-card>
      </div>
    </ng-container>
  </ng-container>
</div>

<app-order-detail-modal
  [orderId]="selectedOrderId()"
  (closed)="closeDetails()"
></app-order-detail-modal>

<!-- Cancel Order Confirmation -->
<div
  *ngIf="isCancelConfirmOpen()"
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
>
  <div
    class="absolute inset-0 bg-[#2D2340]/60 backdrop-blur-sm transition-opacity"
    (click)="closeCancelConfirm()"
  ></div>

  <div
    class="relative bg-white rounded-2xl shadow-xl w-full max-w-sm border border-[#ECE8F3] overflow-hidden p-6 flex flex-col gap-4 text-center"
  >
    <div
      class="w-12 h-12 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto"
    >
      <i class="fa-solid fa-ban text-lg"></i>
    </div>
    <div class="flex flex-col gap-1">
      <h3 class="text-base font-bold text-[#2D2340]">Cancel Order</h3>
      <p class="text-xs text-[#9D93AF] leading-relaxed">
        Are you sure you want to cancel this order?
      </p>
    </div>
    <div class="flex items-center justify-center gap-3 mt-2">
      <button
        type="button"
        (click)="closeCancelConfirm()"
        [disabled]="cancellingOrderId() !== null"
        class="flex-1 py-2.5 border border-[#ECE8F3] text-xs font-bold text-[#5A4F73] rounded-xl hover:bg-[#F6F4F8] transition disabled:opacity-50"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="confirmCancelOrder()"
        [disabled]="cancellingOrderId() !== null"
        class="flex-1 py-2.5 bg-red-500 hover:bg-red-600 text-white text-xs font-bold rounded-xl transition flex items-center justify-center disabled:opacity-50"
      >
        <i
          *ngIf="cancellingOrderId() !== null"
          class="fa-solid fa-circle-notch fa-spin mr-2"
        ></i>
        <span>Confirm</span>
      </button>
    </div>
  </div>
</div>
