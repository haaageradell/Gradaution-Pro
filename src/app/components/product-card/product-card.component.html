<article
  class="group overflow-hidden rounded-[18px] bg-white shadow-[0_4px_18px_rgba(31,20,55,0.08)] transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_10px_28px_rgba(31,20,55,0.14)]"
>
  <!-- Image Section -->
  <div
    class="relative flex h-[240px] items-center justify-center overflow-hidden bg-[#f5f5f7] px-6 pt-6"
  >
    <!-- Wishlist -->
    <button
      type="button"
      (click)="toggleWishlist()"
      class="absolute right-4 top-4 z-10 inline-flex h-10 w-10 items-center justify-center rounded-full bg-white text-[16px] shadow-[0_2px_10px_rgba(0,0,0,0.12)] transition hover:scale-105"
      [ngClass]="wished ? 'text-[#5a2a82]' : 'text-[#8f8a99]'"
      aria-label="Toggle wishlist"
    >
      <i class="fa-heart" [ngClass]="wished ? 'fa-solid' : 'fa-regular'"></i>
    </button>

    <!-- Product Image -->
    <img
      [src]="product.image || fallbackImage"
      (error)="handleImageError($event)"
      [alt]="product.name"
      loading="lazy"
      decoding="async"
      width="300"
      height="300"
      class="h-[170px] w-full object-contain transition duration-300 group-hover:scale-105"
    />

    <!-- Try On -->
    <button
      type="button"
      class="absolute bottom-4 left-4 inline-flex items-center rounded-full bg-white px-4 py-1.5 text-[11px] font-semibold text-[#2e2a35] shadow-[0_2px_8px_rgba(0,0,0,0.12)] transition hover:shadow-md"
    >
      Try Them On
    </button>
  </div>

  <!-- Content -->
  <div class="space-y-2 px-4 pb-4 pt-4">
    <!-- Product Name -->
    <h3
      class="line-clamp-1 text-[16px] font-semibold leading-[1.3] text-[#241b35]"
    >
      {{ product.name }}
    </h3>

    <!-- Rating -->
    <div class="flex items-center gap-1">
      <i class="fa-solid fa-star text-[12px] text-[#f3b447]"></i>

      <span class="text-[14px] font-semibold text-[#2e2a35]">
        {{ (product.rating || 0).toFixed(1) }}
      </span>
    </div>

    <!-- Price + Cart -->
    <div class="flex items-end justify-between pt-1">
      <!-- Price + Cart -->
      <div class="flex items-end justify-between pt-1">
        <div class="flex items-baseline gap-2">
          <span class="text-[17px] font-bold leading-none text-[#2a173d]">
            {{ product.price }}
          </span>
          <span class="text-[12px] font-semibold text-[#c8c3cf] line-through">
            {{ product.oldPrice }} EGP
          </span>
        </div>
      </div>

      <!-- Add To Cart -->
      <button
        type="button"
        (click)="addToCart()"
        [disabled]="isAdding"
        class="cursor-pointer inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#5b257d] text-[15px] text-white transition hover:scale-105 hover:bg-[#6a2d91] disabled:cursor-not-allowed disabled:opacity-60"
        aria-label="Add to cart"
      >
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </div>
</article>
